<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Simplified robot for small size -->
  <!-- Antenna -->
  <rect x="14.5" y="4" width="3" height="6" rx="1.5" fill="white" fill-opacity="0.9"/>
  <circle cx="16" cy="3" r="2.5" fill="#FCD34D"/>
  <!-- Face -->
  <rect x="5" y="10" width="22" height="18" rx="6" fill="white" fill-opacity="0.95"/>
  <!-- Eyes -->
  <rect x="7.5" y="14" width="7" height="5" rx="2.5" fill="#7C3AED"/>
  <rect x="17.5" y="14" width="7" height="5" rx="2.5" fill="#7C3AED"/>
  <!-- Eye highlights -->
  <circle cx="13" cy="15.5" r="1.5" fill="white"/>
  <circle cx="23" cy="15.5" r="1.5" fill="white"/>
  <!-- Smile -->
  <path d="M9 23 Q16 27 23 23" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
